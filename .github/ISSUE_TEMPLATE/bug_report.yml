name: Report a bug
description: Something in ArghBox (widget, API, admin page, MCP or the triage skill) does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search the [open issues](https://github.com/BinaryBananaLLC/ArghBox/issues) first.
        Ideas and questions go to the Feedback tab on [arghbox.com](https://arghbox.com/#arghbox-add). Security problems go to [private reporting](https://github.com/BinaryBananaLLC/ArghBox/security/advisories/new), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ArghBox version or commit
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: PHP version, host and web server
      placeholder: PHP 8.3, Hostinger, LiteSpeed behind Cloudflare
  - type: input
    id: browser
    attributes:
      label: Browser and OS (for widget or admin page bugs)
      placeholder: Firefox 133, Windows 11
  - type: textarea
    id: health
    attributes:
      label: Health check output
      description: The output of `/arghbox/api.php?action=health` on your site. It contains no secrets.
      render: json
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I removed tokens, passwords and my `config.php` from everything above.
          required: true
