name: Release

# Publishes one version, ONLY when the owner asks for it: a GitHub Release with the upload zip, the skill zip
# and the npm tarball (each with a build provenance attestation), then the `arghbox` package on npmjs.com with
# npm provenance.
#
# NO TEST AUTOMATION (owner decision 2026-11-17): this is the only workflow in the repository, it never runs on
# push or pull request, and it runs no tests. Never add CI, test steps or scheduled workflows.
#
# HOW TO RELEASE (all in the browser)
#   Actions -> Release -> Run workflow -> type the new tag, e.g. v0.1.1 -> Run.
#   Nobody edits a version by hand. The tag is created at the selected branch's HEAD, and every job writes
#   its version into the files it uses (tools/set-version.mjs: package.json, the lockfile, arghbox/VERSION,
#   lib/version.php, the widget files, the docs and the tests), and turns CHANGELOG.md's "## [Unreleased]"
#   into the dated "## [x.y.z]" section, which becomes the release notes. After a successful release, the
#   last job commits the same change back to the branch ("Release vx.y.z: ... [skip ci]"), so pull before
#   your next change. Write the notes as you go, under "## [Unreleased]" in CHANGELOG.md.
#   If a run fails part-way, open it and use "Re-run failed jobs" rather than starting a new run.
#   Pushing a vx.y.z tag from a terminal works too.
#   A version with a hyphen (v0.2.0-rc.1) becomes a GitHub pre-release and goes to npm under the "next"
#   dist-tag, so `npm install arghbox` keeps giving the last stable version. Pre-releases are not committed
#   back to the branch.
#
# ONE-TIME SETUP
#   - npm auth, either way:
#       a. a repository secret NPM_TOKEN: a granular access token from npmjs.com with read and write on
#          packages (for the first publish, scope it to all packages; later, to arghbox only), or
#       b. trusted publishing: on npmjs.com, arghbox -> Settings -> Trusted publisher -> GitHub Actions,
#          organization BinaryBananaLLC, repository ArghBox, workflow release.yml. No secret needed; npm can
#          only set this up once the package exists, so the first publish uses (a). Then delete NPM_TOKEN.
#
# MONEY GUARD: the first job runs only while the repository is public, where GitHub-hosted runners are free
# (a private repository bills the account's monthly minutes, and npm refuses provenance from it anyway).
# Every other job needs the first one, so nothing runs in a private repository. Never remove the `if:` line.
#
# Never create releases on the Releases page: this workflow creates the release as a draft, attaches every
# file and only then publishes it, which also works when the repository uses immutable releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.2.0 (created at the selected branch's HEAD if it does not exist; the version is written into every file for you)
        required: true

permissions:
  contents: read

# Two releases at once would race for the same tag and the same npm version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag against package.json and npm
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        name: Resolve the tag and check it against package.json, npm and existing releases
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$GITHUB_REF_NAME"; fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3 or v1.2.3-rc.1 (with the leading v)."; exit 1
          fi
          VERSION="${TAG#v}"
          # The commit to release: the tag's commit when the tag exists, otherwise the selected branch's HEAD.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
            git checkout -q "$SHA"
          else
            SHA="$GITHUB_SHA"
          fi
          # The files may still say the previous version: each job writes this one into them (set-version).
          # A tag older than the files would be a downgrade, though.
          PKG="$(node -p "require('./package.json').version")"
          if [ "$(node --input-type=module -e "import { compareVersions } from './tools/set-version.mjs'; console.log(compareVersions('$VERSION', '$PKG') < 0)")" = "true" ]; then
            echo "::error::The tag says $VERSION, but package.json at ${SHA:0:7} already says $PKG. Release a newer version."; exit 1
          fi
          if npm view "arghbox@$VERSION" version >/dev/null 2>&1; then
            echo "::error::arghbox@$VERSION is already on npm. npm never reuses a version: release the next one."; exit 1
          fi
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)" = "false" ]; then
            echo "::error::A published release $TAG already exists. Release the next version instead."; exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then PRE=true; else PRE=false; fi
          echo "Releasing $TAG from ${SHA:0:7} (pre-release: $PRE)"
          { echo "tag=$TAG"; echo "version=$VERSION"; echo "prerelease=$PRE"; echo "sha=$SHA"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build the release files
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # sign the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Write the version into every file
        run: node tools/set-version.mjs "${{ needs.check.outputs.version }}"
      - name: Build the zips and the npm tarball
        shell: bash
        run: |
          set -euo pipefail
          # Stamp every zip entry with the release commit's time, so a rebuild gives the same bytes.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          npm run pack
          npm pack --ignore-scripts --pack-destination dist
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          retention-days: 7

  release:
    name: GitHub Release
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Write the version into every file (CHANGELOG.md gets its dated section for the notes)
        run: node tools/set-version.mjs "${{ needs.check.outputs.version }}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Create the release as a draft, attach the files, then publish it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ needs.check.outputs.sha }}
          PRE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The release notes are this version's CHANGELOG section.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\n---\n\nInstall with `npm install --save-dev arghbox@%s` and `npx arghbox install --public <your web root> --skill`, or download `arghbox-%s.zip` below and upload its `arghbox` folder. Every file has a build provenance attestation: `gh attestation verify <file> --repo %s`.\n' "$VERSION" "$VERSION" "$GITHUB_REPOSITORY" >> notes.md
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          fi
          PREFLAG=""; if [ "$PRE" = "true" ]; then PREFLAG="--prerelease"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A draft left by an earlier failed run: refresh its files and notes.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md --title "ArghBox $VERSION" $PREFLAG
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "ArghBox $VERSION" --notes-file notes.md $PREFLAG
          fi
          gh release edit "$TAG" --draft=false
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

  npm:
    name: Publish to npm (provenance)
    needs: [check, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm provenance, and trusted publishing when it is set up
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or newer.
      - run: npm install --global npm@11
      - name: Write the version into every file
        run: node tools/set-version.mjs "${{ needs.check.outputs.version }}"
      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "No NPM_TOKEN secret: publishing through npm trusted publishing (see the setup notes at the top of this file)."; fi
          TAGFLAG=""; if [ "$PRE" = "true" ]; then TAGFLAG="--tag next"; fi
          npm publish --provenance --access public --ignore-scripts $TAGFLAG

  sync-version:
    name: Commit the version back to the branch
    # The jobs above write the version into the files inside their runners only. This writes the same change
    # to the branch the release came from (the default branch for a pushed tag), so the repository, the
    # release and npm agree and the next run starts from this version. It runs only after npm published, and
    # never for pre-releases. GITHUB_TOKEN pushes start no workflows, and the commit says [skip ci] as well.
    # main is not protected today. If it ever is, this push needs a ruleset bypass actor (for example a token
    # minted for a GitHub App on the bypass list); only this job would fail, because the release is out by then.
    needs: [check, npm]
    if: ${{ needs.check.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the version commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Write the version and commit it if anything changed
        shell: bash
        env:
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # --if-newer: never move the branch back if it already says this version or a later one.
          node tools/set-version.mjs "$VERSION" --if-newer
          if git diff --quiet; then echo "The branch already says $VERSION: nothing to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Release $TAG: set the version everywhere [skip ci]"
          git pull -q --rebase
          git push -q
          echo "Committed $VERSION to $(git rev-parse --abbrev-ref HEAD) as $(git rev-parse --short HEAD)."
