<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ArghBox social image</title>
<!-- Template for art/social-github.png (1280x640) and art/brand/og-image.png (1200x630).
     Rendered by tools/render-art.mjs. A 1200x630 stage is scaled to fit and centred; the background fills the rest.
     Same design as the arghbox.com social card. -->
<style>
@font-face{font-family:"Inter";src:url("../fonts/Inter.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"IBM Plex Mono";src:url("../fonts/IBMPlexMono-600.woff2") format("woff2");font-weight:600}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{position:relative;font-family:"Inter",sans-serif;color:#1E2430;background:linear-gradient(135deg,#fff 0%,#EEF2F6 100%)}
.bar{position:absolute;left:0;top:0;width:100%;height:8px;background:#F43F5E}
.stage{position:absolute;left:50%;top:50%;width:1200px;height:630px;transform-origin:0 0}
.url{position:absolute;left:80px;top:56px;font:600 22px "IBM Plex Mono",monospace;color:#5B6475}
.left{position:absolute;left:80px;top:150px;width:660px}
.word{font-weight:800;font-size:128px;line-height:1;letter-spacing:-4px}
.word b{color:#0369A1;font-weight:800}
.tag{margin-top:28px;font-size:40px;line-height:1.25;font-weight:600}
.tag em{font-style:normal;color:#BE123C}
.chips{margin-top:40px;display:flex;gap:12px}
.chips span{font:600 20px "IBM Plex Mono",monospace;color:#0369A1;background:#E0F2FE;border:1px solid #CBD5E1;border-radius:999px;padding:8px 18px}
.card{position:absolute;right:70px;top:95px;width:400px;height:440px;background:#fff;border:1px solid #E2E8F0;border-radius:28px;box-shadow:0 24px 60px rgba(30,36,48,.14)}
.mascot{position:absolute;left:40px;top:36px;width:320px;height:320px}
.argh{position:absolute;left:40px;bottom:28px;font:600 26px "IBM Plex Mono",monospace;color:#BE123C;background:#FFF1F3;border-radius:10px;padding:6px 14px}
</style></head><body>
<div class="bar"></div>
<div class="stage" id="stage">
  <div class="url">arghbox.com</div>
  <div class="left">
    <div class="word">Argh<b>Box</b></div>
    <div class="tag">The complaint box your <em>AI empties</em> for you.</div>
    <div class="chips"><span>Free hosting</span><span>Free AI</span><span>Open source</span></div>
  </div>
  <div class="card">
    <img class="mascot" src="../logo-mark.svg" alt="">
    <span class="argh">Argh! +1</span>
  </div>
</div>
<script>
var s=Math.min(innerWidth/1200,innerHeight/630),st=document.getElementById('stage');
st.style.transform='scale('+s+') translate(-50%,-50%)';
</script>
</body></html>
